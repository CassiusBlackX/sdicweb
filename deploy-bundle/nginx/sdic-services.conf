# Include this file inside your existing `server { listen 80; server_name
# sdic.sjtu.edu.cn; ... }` block on the public nginx server (the school
# gateway terminates HTTPS and reverse-proxies to this box over plain HTTP
# on port 80, so this nginx never needs its own TLS config).
#
#   server {
#       listen 80;
#       server_name sdic.sjtu.edu.cn;
#       include /etc/nginx/sdic-services.conf;
#   }
#
# Then: nginx -t && systemctl reload nginx (or however you normally reload).
#
# Assumes every container from the deploy bundle is running with its
# published ports bound to 127.0.0.1 (exactly what scripts/03 and 05 do) —
# nginx is the only thing that can reach them.

# ---- ccwebsite: static site, not part of this bundle ----------------------
# Deployed by ccwebsite/deploy.sh (rsyncs dist/ here directly, no container).
root /var/www/sdic;
index index.html;

location / {
    try_files $uri $uri/ $uri.html =404;
}

# ---- Authelia's own login portal — must stay open, not gated. -------------
location /authelia/ {
    proxy_pass http://127.0.0.1:9091/authelia/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Hardcoded, not $scheme: this nginx only ever speaks plain HTTP (the
    # school gateway terminates real TLS upstream and forwards here), but
    # every request that reaches this box genuinely came in over HTTPS from
    # the browser's point of view — Authelia's session/cookie logic (and
    # the apps' COOKIE_SECURE=true) need to be told that truth explicitly,
    # since nginx's own $scheme would otherwise report "http" and break both.
    proxy_set_header X-Forwarded-Proto https;
}

# Internal-only: nginx asks Authelia "is this request authenticated?"
location /internal/authelia/authz {
    internal;
    proxy_pass http://127.0.0.1:9091/api/authz/auth-request;
    proxy_set_header X-Original-Method $request_method;
    # Hardcoded https:// for the same reason as X-Forwarded-Proto above —
    # Authelia rejects a http:// target URL outright ("insecure scheme").
    proxy_set_header X-Original-URL https://$host$request_uri;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Content-Length "";
    proxy_set_header Connection "";
    proxy_pass_request_body off;
}

# ---- server_info ------------------------------------------------------------
location = /server_info { return 301 /server_info/; }
location /server_info/ {
    auth_request /internal/authelia/authz;
    auth_request_set $redirection_url $upstream_http_location;
    auth_request_set $sso_user $upstream_http_remote_user;
    auth_request_set $sso_name $upstream_http_remote_name;
    auth_request_set $sso_email $upstream_http_remote_email;
    error_page 401 =302 $redirection_url;

    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Hardcoded, not $scheme: this nginx only ever speaks plain HTTP (the
    # school gateway terminates real TLS upstream and forwards here), but
    # every request that reaches this box genuinely came in over HTTPS from
    # the browser's point of view — Authelia's session/cookie logic (and
    # the apps' COOKIE_SECURE=true) need to be told that truth explicitly,
    # since nginx's own $scheme would otherwise report "http" and break both.
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Remote-User $sso_user;
    proxy_set_header Remote-Name $sso_name;
    proxy_set_header Remote-Email $sso_email;
    proxy_buffering off;
    proxy_read_timeout 60s;
}

# ---- weekly_report ------------------------------------------------------------
location = /weekly_report { return 301 /weekly_report/; }
location /weekly_report/ {
    auth_request /internal/authelia/authz;
    auth_request_set $redirection_url $upstream_http_location;
    auth_request_set $sso_user $upstream_http_remote_user;
    auth_request_set $sso_name $upstream_http_remote_name;
    auth_request_set $sso_email $upstream_http_remote_email;
    error_page 401 =302 $redirection_url;

    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Hardcoded, not $scheme: this nginx only ever speaks plain HTTP (the
    # school gateway terminates real TLS upstream and forwards here), but
    # every request that reaches this box genuinely came in over HTTPS from
    # the browser's point of view — Authelia's session/cookie logic (and
    # the apps' COOKIE_SECURE=true) need to be told that truth explicitly,
    # since nginx's own $scheme would otherwise report "http" and break both.
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Remote-User $sso_user;
    proxy_set_header Remote-Name $sso_name;
    proxy_set_header Remote-Email $sso_email;
    client_max_body_size 20m;
}

# Bridge endpoint galene's built-in authServer client flow calls to fetch a
# JWT asserting the caller's real SSO identity.
location = /meetings-auth {
    auth_request /internal/authelia/authz;
    auth_request_set $redirection_url $upstream_http_location;
    auth_request_set $sso_user $upstream_http_remote_user;
    auth_request_set $sso_name $upstream_http_remote_name;
    error_page 401 =302 $redirection_url;

    proxy_pass http://127.0.0.1:8090/;
    proxy_http_version 1.1;
    proxy_set_header Remote-User $sso_user;
    proxy_set_header Remote-Name $sso_name;
}

# Self-service password change. See password-change-bridge/server.js for
# why this exists instead of Authelia's built-in one (requires an emailed
# one-time code that can never arrive — lab members' directory emails are
# placeholders) or lldap's own UI (a root-path-assuming compiled WASM app
# that can't share this domain with ccwebsite, which already owns "/").
location = /account { return 301 /account/; }
location /account/ {
    auth_request /internal/authelia/authz;
    auth_request_set $redirection_url $upstream_http_location;
    auth_request_set $sso_user $upstream_http_remote_user;
    auth_request_set $sso_name $upstream_http_remote_name;
    error_page 401 =302 $redirection_url;

    proxy_pass http://127.0.0.1:8095/;
    proxy_http_version 1.1;
    proxy_set_header Remote-User $sso_user;
    proxy_set_header Remote-Name $sso_name;
}

# ---- galene (meeting) ------------------------------------------------------
location = /meetings { return 301 /meetings/; }
location /meetings/ {
    auth_request /internal/authelia/authz;
    auth_request_set $redirection_url $upstream_http_location;
    error_page 401 =302 $redirection_url;

    proxy_pass http://127.0.0.1:8180/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Hardcoded, not $scheme: this nginx only ever speaks plain HTTP (the
    # school gateway terminates real TLS upstream and forwards here), but
    # every request that reaches this box genuinely came in over HTTPS from
    # the browser's point of view — Authelia's session/cookie logic (and
    # the apps' COOKIE_SECURE=true) need to be told that truth explicitly,
    # since nginx's own $scheme would otherwise report "http" and break both.
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_buffering off;
}

# galene's own static JS (mainpage.js's group-join status check, and the
# actual room page navigation) hardcodes root-absolute "/group/..." paths
# rather than respecting the /meetings/ prefix (unlike its server-templated
# HTML, which does use the prefix via data/config.json's proxyURL). Without
# this, joining a room 404s with "No such group" since /group/... falls
# through to the ccwebsite static site instead of reaching galene.
location /group/ {
    auth_request /internal/authelia/authz;
    auth_request_set $redirection_url $upstream_http_location;
    error_page 401 =302 $redirection_url;

    proxy_pass http://127.0.0.1:8180/group/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_buffering off;
}

# Same root-absolute-path issue for the homepage's "Public groups" list fetch.
location = /public-groups.json {
    auth_request /internal/authelia/authz;
    auth_request_set $redirection_url $upstream_http_location;
    error_page 401 =302 $redirection_url;

    proxy_pass http://127.0.0.1:8180/public-groups.json;
    proxy_set_header Host $host;
}

# NOTE: lldap's admin UI (127.0.0.1:17170 on this box) is deliberately NOT
# exposed here. Manage lab members over an SSH tunnel instead — see the
# bundle README. Putting a member-directory admin panel on the public
# internet, even SSO-gated, is unnecessary extra attack surface for
# something you'll only use occasionally.
